<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor Product list with cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <main class="products-section">
      <h1>Desserts</h1>
      <div class="product-grid" id="product-grid">
 
      </div>
    </main>

    <aside class="cart-section">
      <div class="cart-card" id="cart-card">
        <h2>Your Cart (<span id="cart-count">0</span>)</h2>
        
       
        <div class="empty-cart" id="empty-cart">
          <img src="./assets/images/illustration-empty-cart.svg" alt="Empty cart illustration">
          <p>Your added items will appear here</p>
        </div>

        
        <div class="active-cart hidden" id="active-cart">
          <ul class="cart-items" id="cart-items"></ul>
          <div class="cart-total-container">
            <span>Order Total</span>
            <strong class="cart-total-price" id="cart-total-price">$0.00</strong>
          </div>
          <div class="carbon-delivery">
            <img src="./assets/images/icon-carbon-neutral.svg" alt="Carbon neutral icon">
            <p>This is a <strong>carbon-neutral</strong> delivery</p>
          </div>
          <button class="confirm-order-btn" id="confirm-order-btn">Confirm Order</button>
        </div>
      </div>
    </aside>
  </div>
 
  
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal-content">
      <img src="./assets/images/icon-order-confirmed.svg" alt="Order confirmed icon" class="modal-icon">
      <h2>Order Confirmed</h2>
      <p class="modal-subtext">We hope you enjoy your food!</p>
      
      <div class="summary-container">
        <ul class="summary-items" id="summary-items"></ul>
        <div class="summary-total-container">
          <span>Order Total</span>
          <strong id="summary-total-price">$0.00</strong>
        </div>
      </div>

      <button class="new-order-btn" id="new-order-btn">Start New Order</button>
    </div>
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/hussainkamal144258-lab/product-list-with-cart-main.git">Hussein Kamal</a>.
  </footer>

  <script src="script.js"></script>
</body>
</html>
